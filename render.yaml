services:
  - type: web
    name: feedback-ml-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt && python -c "import nltk; nltk.download('stopwords')"
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: API_KEY
        sync: false
